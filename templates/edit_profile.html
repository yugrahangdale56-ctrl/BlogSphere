<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | BlogSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        nav {
            background: #0d6efd;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #dc3545;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<nav>

    <h2>BlogSphere</h2>

    <div>

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('profile') }}">Profile</a>

        <a href="{{ url_for('logout') }}">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>✏️ Edit Profile</h1>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            required>


        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            required>


        <button type="submit">
            Save Changes
        </button>

    </form>


    <a
        href="{{ url_for('profile') }}"
        class="cancel">

        Cancel

    </a>

</div>

</body>

</html>
