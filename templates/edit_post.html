<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Post | BlogSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        /* Navigation */

        nav {
            background: #0d6efd;
            color: white;
            padding: 15px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        /* Main container */

        .container {
            width: 60%;
            max-width: 800px;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 25px;
        }

        /* Form */

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 16px;
        }

        textarea {
            min-height: 250px;

            resize: vertical;
        }

        /* Update button */

        .update-btn {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            background: #198754;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-btn:hover {
            background: #146c43;
        }

        /* Back button */

        .back-btn {
            display: inline-block;

            margin-top: 15px;

            padding: 10px 18px;

            background: #6c757d;

            color: white;

            text-decoration: none;

            border-radius: 5px;
        }

        .back-btn:hover {
            background: #5c636a;
        }

        /* Mobile */

        @media(max-width: 768px) {

            .container {
                width: 90%;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin-left: 5px;
            }

        }

    </style>

</head>

<body>


<!-- NAVIGATION -->

<nav>

    <h2>BlogSphere</h2>

    <div>

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('create_post') }}">Create Post</a>

        <a href="{{ url_for('profile') }}">Profile</a>

        <a href="{{ url_for('logout') }}">Logout</a>

    </div>

</nav>


<!-- EDIT FORM -->

<div class="container">

    <h1>Edit Blog Post</h1>


    <form method="POST">


        <label>Title</label>

        <input
            type="text"
            name="title"
            value="{{ post.title }}"
            required
        >


        <label>Content</label>

        <textarea
            name="content"
            required
        >{{ post.content }}</textarea>


        <label>Author</label>

        <input
            type="text"
            name="author"
            value="{{ current_user.username }}"
            readonly
        >


        <button
            type="submit"
            class="update-btn"
        >
            Update Post
        </button>


    </form>


    <a
        href="{{ url_for('home') }}"
        class="back-btn"
    >
        ← Back to Home
    </a>


</div>


</body>
</html>
