<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}
.container{
    width:400px;
    margin:150px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(107, 120, 101, 0.2);
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    width:100%;
    padding:10px;
    background:#28a745;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover{
    background:#218838;
}
a{
    text-decoration:none;
}
</style>
</head>
<body>

<div class="container">
<h2>Login</h2>

<form method="POST" action="/">
<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>
</form>

<p>Don't have an account?
     <a href="/register">Register</a>
</p>

</div>

</body>
</html>
